<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Chaitanya Pathak</title>

    <link rel="stylesheet" href="style.css">
    <meta name="description"
          content="Contact Chaitanya Pathak through the accessible contact form.">
    <meta name="author" content="Chaitanya Pathak">
</head>

<body>

<header>
    <h1>Contact Me</h1>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section aria-labelledby="contact-heading">

        <h2 id="contact-heading">Get in Touch</h2>

        <form action="#" method="post">

            <div>
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required>
            </div>

            <br>

            <div>
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>
            </div>

            <br>

            <div>
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required></textarea>
            </div>

            <br>

            <button type="submit">Send Message</button>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Chaitanya Pathak. All rights reserved.</p>
</footer>

</body>
</html>
